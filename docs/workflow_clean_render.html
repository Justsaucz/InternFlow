<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InternFlow - Clean Linear Workflow</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px 20px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
  }
  #workflow-container {
    background: #ffffff;
    width: 840px;
    margin: 0 auto;
    padding: 15px;
  }
  .header {
    text-align: center;
    margin-bottom: 22px;
  }
  .header h2 {
    font-size: 26px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 5px 0;
    letter-spacing: -0.5px;
  }
  .header p {
    font-size: 13.5px;
    color: #64748b;
    margin: 0 0 16px 0;
  }
  .legend {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #334155;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-box {
    width: 14px;
    height: 14px;
    border-radius: 4px;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div id="workflow-container">
  <div class="header">
    <h2>Workflow of the System</h2>
    <p>InternFlow End-to-End Operational Lifecycle</p>
    
    <div class="legend">
      <div class="legend-item"><span class="legend-box" style="background: #f0fdf4; border: 1.5px solid #059669;"></span> <span>Student Action</span></div>
      <div class="legend-item"><span class="legend-box" style="background: #eff6ff; border: 1.5px solid #2563eb;"></span> <span>Company HR / Mentor</span></div>
      <div class="legend-item"><span class="legend-box" style="background: #fef2f2; border: 1.5px solid #dc2626;"></span> <span>Automated System Engine</span></div>
      <div class="legend-item"><span class="legend-box" style="background: #fffbeb; border: 1.5px solid #d97706; transform: rotate(45deg); width: 10px; height: 10px; margin: 0 3px;"></span> <span>Decision Gate</span></div>
      <div class="legend-item"><span class="legend-box" style="background: #f8fafc; border: 1.5px solid #64748b;"></span> <span>Public / Guest / Auth</span></div>
    </div>
  </div>

  <svg viewBox="0 0 800 1785" width="800" height="1785" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Markers -->
      <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
      </marker>
      <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
      </marker>
      <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
      </marker>
      <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
      </marker>

      <filter id="shadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.06" />
      </filter>
    </defs>

    <style>
      /* Nodes */
      .node-start { fill: #f8fafc; stroke: #334155; stroke-width: 1.8; rx: 18px; }
      .node-pub   { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; rx: 8px; }
      .node-stu   { fill: #f0fdf4; stroke: #059669; stroke-width: 1.6; rx: 8px; }
      .node-hr    { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 8px; }
      .node-sys   { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; rx: 8px; }
      .node-dec   { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; }
      .node-term  { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.6; rx: 6px; }

      /* Tags / Badges (Stacked centered on top line) */
      .tag-stu { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 800; fill: #059669; text-anchor: middle; letter-spacing: 0.8px; }
      .tag-hr  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 800; fill: #2563eb; text-anchor: middle; letter-spacing: 0.8px; }
      .tag-sys { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 800; fill: #dc2626; text-anchor: middle; letter-spacing: 0.8px; }
      .tag-pub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 9.5px; font-weight: 800; fill: #64748b; text-anchor: middle; letter-spacing: 0.8px; }

      /* Typography */
      .txt-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .txt-sub   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #64748b; text-anchor: middle; }
      .txt-yes   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #059669; text-anchor: middle; }
      .txt-no    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; text-anchor: middle; }

      /* Lines */
      .line       { fill: none; stroke: #475569; stroke-width: 1.6; }
      .line-green { fill: none; stroke: #059669; stroke-width: 1.6; }
      .line-blue  { fill: none; stroke: #2563eb; stroke-width: 1.6; }
      .line-red   { fill: none; stroke: #dc2626; stroke-width: 1.6; }
    </style>

    <!-- Center axis: x = 400 -->

    <!-- ========================================================================= -->
    <!-- 1. ENTRY & AUTHENTICATION                                                 -->
    <!-- ========================================================================= -->

    <!-- Start Node -->
    <rect class="node-start" x="310" y="20" width="180" height="36" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="43">Start: Visit InternFlow (/)</text>

    <!-- Down to Browse Jobs as Guest -->
    <path class="line" d="M 400 56 L 400 80" marker-end="url(#arr)" />
    <rect class="node-pub" x="250" y="80" width="300" height="56" filter="url(#shadow)" />
    <text class="tag-pub" x="400" y="97">PUBLIC / GUEST</text>
    <text class="txt-title" x="400" y="113">Step 1: Browse Job Board</text>
    <text class="txt-sub" x="400" y="127">Search keywords &amp; filter modality / allowance</text>

    <!-- Down to Decision: Has Account? -->
    <path class="line" d="M 400 136 L 400 160" marker-end="url(#arr)" />
    <polygon class="node-dec" points="400,160 480,190 400,220 320,190" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="194">Has Account?</text>

    <!-- Branch: No -> Register (Left) -->
    <path class="line" d="M 320 190 L 200 190" marker-end="url(#arr)" />
    <text class="txt-no" x="260" y="182">No</text>
    <rect class="node-pub" x="60" y="166" width="140" height="48" filter="url(#shadow)" />
    <text class="txt-title" x="130" y="186">Step 1b: Register</text>
    <text class="txt-sub" x="130" y="202">Select Student / HR</text>

    <!-- Register loops to Login -->
    <path class="line" d="M 130 214 L 130 268 L 260 268" marker-end="url(#arr)" />

    <!-- Branch: Yes -> Login (Down) -->
    <path class="line" d="M 400 220 L 400 240" marker-end="url(#arr)" />
    <text class="txt-yes" x="415" y="233">Yes</text>

    <rect class="node-pub" x="260" y="240" width="280" height="56" filter="url(#shadow)" />
    <text class="tag-pub" x="400" y="257">AUTHENTICATION</text>
    <text class="txt-title" x="400" y="273">Step 2: Sign In (/login)</text>
    <text class="txt-sub" x="400" y="287">Authenticate credentials &amp; issue JWT token</text>


    <!-- ========================================================================= -->
    <!-- 2. JOB POSTING & APPLICATION                                              -->
    <!-- ========================================================================= -->

    <!-- Down to HR Post Job -->
    <path class="line-blue" d="M 400 296 L 400 320" marker-end="url(#arr-blue)" />
    <rect class="node-hr" x="240" y="320" width="320" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="337">COMPANY HR</text>
    <text class="txt-title" x="400" y="353">Step 3: Post Internship Job Opening</text>
    <text class="txt-sub" x="400" y="367">Specify position, allowance, modality &amp; skills</text>

    <!-- Down to Student Apply -->
    <path class="line-green" d="M 400 376 L 400 400" marker-end="url(#arr-green)" />
    <rect class="node-stu" x="230" y="400" width="340" height="56" filter="url(#shadow)" />
    <text class="tag-stu" x="400" y="417">STUDENT</text>
    <text class="txt-title" x="400" y="433">Step 4: Submit Application with Resume</text>
    <text class="txt-sub" x="400" y="447">Upload PDF to S3 + Cover Letter (1 app / company)</text>


    <!-- ========================================================================= -->
    <!-- 3. SCREENING & INTERVIEW PIPELINE                                         -->
    <!-- ========================================================================= -->

    <!-- Down to HR Review -->
    <path class="line-blue" d="M 400 456 L 400 480" marker-end="url(#arr-blue)" />
    <rect class="node-hr" x="240" y="480" width="320" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="497">COMPANY HR</text>
    <text class="txt-title" x="400" y="513">Step 5: Review Applicant Roster</text>
    <text class="txt-sub" x="400" y="527">Inspect candidate GPA &amp; download S3 resume</text>

    <!-- Down to Decision: Shortlist for Interview? -->
    <path class="line-blue" d="M 400 536 L 400 560" marker-end="url(#arr-blue)" />
    <polygon class="node-dec" points="400,560 485,590 400,620 315,590" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="594">Shortlist Candidate?</text>

    <!-- Branch: No -> REJECTED (Right) -->
    <path class="line-red" d="M 485 590 L 590 590" marker-end="url(#arr-red)" />
    <text class="txt-no" x="535" y="582">No</text>
    <rect class="node-term" x="590" y="572" width="90" height="36" filter="url(#shadow)" />
    <text class="txt-no" x="635" y="595">REJECTED</text>

    <!-- Branch: Yes -> Schedule Interview -->
    <path class="line-blue" d="M 400 620 L 400 644" marker-end="url(#arr-blue)" />
    <text class="txt-yes" x="415" y="634">Yes</text>

    <rect class="node-hr" x="240" y="644" width="320" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="661">COMPANY HR</text>
    <text class="txt-title" x="400" y="677">Step 6: Schedule Interview</text>
    <text class="txt-sub" x="400" y="691">Sets status to INTERVIEW_SCHEDULED &amp; meeting details</text>

    <!-- Down to Student Receives Interview Notice -->
    <path class="line-green" d="M 400 700 L 400 724" marker-end="url(#arr-green)" />
    <rect class="node-stu" x="240" y="724" width="320" height="56" filter="url(#shadow)" />
    <text class="tag-stu" x="400" y="741">STUDENT</text>
    <text class="txt-title" x="400" y="757">Step 7: Receive Interview Alert</text>
    <text class="txt-sub" x="400" y="771">View Indigo alert &amp; attend external interview session</text>

    <!-- Down to Decision: Pass Interview / Extend Offer? -->
    <path class="line-blue" d="M 400 780 L 400 804" marker-end="url(#arr-blue)" />
    <polygon class="node-dec" points="400,804 485,834 400,864 315,834" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="838">Extend Offer?</text>

    <!-- Branch: No -> REJECTED (Right) -->
    <path class="line-red" d="M 485 834 L 590 834" marker-end="url(#arr-red)" />
    <text class="txt-no" x="535" y="826">No</text>
    <rect class="node-term" x="590" y="816" width="90" height="36" filter="url(#shadow)" />
    <text class="txt-no" x="635" y="839">REJECTED</text>

    <!-- Branch: Yes -> Extend Offer -->
    <path class="line-blue" d="M 400 864 L 400 888" marker-end="url(#arr-blue)" />
    <text class="txt-yes" x="415" y="878">Yes</text>

    <rect class="node-hr" x="250" y="888" width="300" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="905">COMPANY HR</text>
    <text class="txt-title" x="400" y="921">Step 8: Extend Placement Offer</text>
    <text class="txt-sub" x="400" y="935">Sets status to ACCEPTED on student dashboard</text>


    <!-- ========================================================================= -->
    <!-- 4. PLACEMENT COMMITMENT & EXCLUSIVITY                                      -->
    <!-- ========================================================================= -->

    <!-- Down to Decision: Student Accepts Offer? -->
    <path class="line-green" d="M 400 944 L 400 968" marker-end="url(#arr-green)" />
    <polygon class="node-dec" points="400,968 490,998 400,1028 310,998" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="1002">Student Accepts Offer?</text>

    <!-- Branch: No -> Declined (Left) -->
    <path class="line" d="M 310 998 L 210 998" marker-end="url(#arr)" />
    <text class="txt-no" x="260" y="990">No</text>
    <rect class="node-pub" x="110" y="980" width="100" height="36" filter="url(#shadow)" />
    <text class="txt-sub" x="160" y="1003">Offer Declined</text>

    <!-- Branch: Yes -> Commit Placement -->
    <path class="line-green" d="M 400 1028 L 400 1052" marker-end="url(#arr-green)" />
    <text class="txt-yes" x="415" y="1042">Yes</text>

    <rect class="node-stu" x="240" y="1052" width="320" height="56" filter="url(#shadow)" />
    <text class="tag-stu" x="400" y="1069">STUDENT</text>
    <text class="txt-title" x="400" y="1085">Step 9: Confirm Placement (COMMITTED)</text>
    <text class="txt-sub" x="400" y="1099">Locks active working placement into student profile</text>

    <!-- Down to System Auto-Decline Engine -->
    <path class="line-red" d="M 400 1108 L 400 1132" marker-end="url(#arr-red)" />
    <rect class="node-sys" x="215" y="1132" width="370" height="56" filter="url(#shadow)" />
    <text class="tag-sys" x="400" y="1149">SYSTEM EXCLUSIVITY ENGINE</text>
    <text class="txt-title" x="400" y="1165" style="fill:#dc2626;">Step 10: Auto-Cancel Competing Applications</text>
    <text class="txt-sub" x="400" y="1179" style="fill:#991b1b;">Enforces single placement exclusivity across all companies</text>


    <!-- ========================================================================= -->
    <!-- 5. CWIE DAILY LOGBOOK & MENTOR SIGN-OFF                                   -->
    <!-- ========================================================================= -->

    <!-- Down to Student Daily Logbook -->
    <path class="line-green" d="M 400 1188 L 400 1212" marker-end="url(#arr-green)" />
    <rect class="node-stu" x="230" y="1212" width="340" height="56" filter="url(#shadow)" />
    <text class="tag-stu" x="400" y="1229">STUDENT</text>
    <text class="txt-title" x="400" y="1245">Step 11: Submit Daily CWIE Logbook</text>
    <text class="txt-sub" x="400" y="1259">8.0 hrs/day, Modality, deliverables &amp; problem fixes</text>

    <!-- Down to Decision: Backdated Entry? -->
    <path class="line" d="M 400 1268 L 400 1292" marker-end="url(#arr)" />
    <polygon class="node-dec" points="400,1292 485,1322 400,1352 315,1322" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="1326">Late Entry (Backdated)?</text>

    <!-- Branch: Yes -> Flag Audit Warning (Left) -->
    <path class="line" d="M 315 1322 L 225 1322" marker-end="url(#arr)" />
    <text class="txt-yes" x="270" y="1314">Yes</text>
    <rect class="node-pub" x="80" y="1304" width="145" height="36" filter="url(#shadow)" />
    <text class="txt-sub" x="152" y="1327" style="fill:#d97706; font-weight:700;">Audit Warning Flag</text>

    <!-- Line from Audit flag rejoins down to Mentor drawer -->
    <path class="line" d="M 152 1340 L 152 1376 L 400 1376" />

    <!-- Branch: No -> Direct down to Mentor Drawer -->
    <path class="line" d="M 400 1352 L 400 1376" />
    <text class="txt-no" x="415" y="1365">No</text>

    <!-- Meeting point down to Mentor Drawer -->
    <path class="line-blue" d="M 400 1376 L 400 1400" marker-end="url(#arr-blue)" />

    <rect class="node-hr" x="225" y="1400" width="350" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="1417">COMPANY MENTOR</text>
    <text class="txt-title" x="400" y="1433">Step 12: Mentor Inspection Drawer &amp; Sign-Off</text>
    <text class="txt-sub" x="400" y="1447">Verifies daily hours, awards 1–5 stars &amp; feedback</text>


    <!-- ========================================================================= -->
    <!-- 6. FINAL EVALUATION & CERTIFICATION                                      -->
    <!-- ========================================================================= -->

    <!-- Down to Decision: Hours Completed? -->
    <path class="line-blue" d="M 400 1456 L 400 1480" marker-end="url(#arr-blue)" />
    <polygon class="node-dec" points="400,1480 490,1510 400,1540 310,1510" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="1514">Total Hours ≥ 300 hrs?</text>

    <!-- Branch: No -> Continue Daily Logging (Clean Right Loop) -->
    <path class="line" d="M 490 1510 L 620 1510 L 620 1240 L 570 1240" marker-end="url(#arr)" />
    <text class="txt-no" x="555" y="1502">No (Continue Term)</text>

    <!-- Branch: Yes -> Performance Rubric -->
    <path class="line-blue" d="M 400 1540 L 400 1564" marker-end="url(#arr-blue)" />
    <text class="txt-yes" x="415" y="1554">Yes</text>

    <rect class="node-hr" x="225" y="1564" width="350" height="56" filter="url(#shadow)" />
    <text class="tag-hr" x="400" y="1581">COMPANY MENTOR</text>
    <text class="txt-title" x="400" y="1597">Step 13: Submit 3-Category Performance Rubric</text>
    <text class="txt-sub" x="400" y="1611">Quality of Work, Punctuality &amp; Teamwork (1–5 ★)</text>

    <!-- Down to Certificate -->
    <path class="line-green" d="M 400 1620 L 400 1644" marker-end="url(#arr-green)" />
    <rect class="node-stu" x="220" y="1644" width="360" height="56" filter="url(#shadow)" />
    <text class="tag-stu" x="400" y="1661">OFFICIAL CERTIFICATION</text>
    <text class="txt-title" x="400" y="1677">Step 14: Verified CWIE Completion Report</text>
    <text class="txt-sub" x="400" y="1691">Accredited certificate &amp; summary report for university defense</text>

    <!-- Down to End -->
    <path class="line" d="M 400 1700 L 400 1726" marker-end="url(#arr)" />
    <rect class="node-start" x="310" y="1726" width="180" height="36" filter="url(#shadow)" />
    <text class="txt-title" x="400" y="1749">End: Internship Certified</text>

  </svg>
</div>

</body>
</html>
