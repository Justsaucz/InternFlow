<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InternFlow - Entity-Relationship (ER) Diagram</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #0f172a;
  }
  #canvas-container {
    background: #ffffff;
    width: 1220px;
    margin: 0 auto;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<div id="canvas-container">
  <svg viewBox="0 0 1220 950" width="1220" height="950" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Crow's foot (Many) marker -->
      <marker id="crow-end" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="12" markerHeight="12" orient="auto">
        <path d="M 2 2 L 14 8 L 2 14 M 14 1 L 14 15" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </marker>
      <marker id="crow-start" viewBox="0 0 16 16" refX="1" refY="8" markerWidth="12" markerHeight="12" orient="auto">
        <path d="M 14 2 L 2 8 L 14 14 M 2 1 L 2 15" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </marker>

      <!-- One-only (1) bar marker -->
      <marker id="one-end" viewBox="0 0 14 16" refX="10" refY="8" markerWidth="10" markerHeight="12" orient="auto">
        <path d="M 5 2 L 5 14 M 9 2 L 9 14" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" />
      </marker>
      <marker id="one-start" viewBox="0 0 14 16" refX="4" refY="8" markerWidth="10" markerHeight="12" orient="auto">
        <path d="M 5 2 L 5 14 M 9 2 L 9 14" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round" />
      </marker>

      <filter id="card-shadow" x="-2%" y="-1%" width="104%" height="104%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06" />
      </filter>
    </defs>

    <style>
      .tbl-bg { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .tbl-hdr-bg { fill: #e2e8f0; stroke: #334155; stroke-width: 1.5; }
      .tbl-hdr-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .col-pk { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .col-fk { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; }
      .col-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11.5px; font-weight: 500; fill: #0f172a; }
      .col-type { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #475569; text-anchor: end; }
      .rel-line { fill: none; stroke: #334155; stroke-width: 1.6; stroke-linejoin: round; }
    </style>

    <!-- ================= RELATIONSHIP LINES (0 CROSSINGS) ================= -->
    
    <!-- 1. Users (470..750, y=30..195) to StudentProfiles (40..320, y=90..325) -->
    <!-- Center-Top to Left-Top: Horizontal line -->
    <path class="rel-line" d="M 470 120 L 320 120" marker-start="url(#one-start)" marker-end="url(#one-end)" />

    <!-- 2. Users (470..750, y=30..195) to CompanyProfiles (900..1180, y=50..285) -->
    <!-- Center-Top to Right-Top: Horizontal line -->
    <path class="rel-line" d="M 750 120 L 900 120" marker-start="url(#one-start)" marker-end="url(#one-end)" />

    <!-- 3. Users (470..750) down to Documents (470..750, y=235..385) -->
    <path class="rel-line" d="M 610 195 L 610 235" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 4. Documents (470..750, y=235..385) down to Applications (470..750, y=425..645) -->
    <path class="rel-line" d="M 610 385 L 610 425" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 5. StudentProfiles (40..320) down to DailyLogs (40..340, y=520..830) -->
    <path class="rel-line" d="M 170 325 L 170 520" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 6. StudentProfiles (40..320) to Applications (470..750) -->
    <!-- Out from StudentProfiles right, step down into Applications left -->
    <path class="rel-line" d="M 320 260 L 400 260 L 400 480 L 470 480" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 7. Applications (470..750) to DailyLogs (40..340) -->
    <!-- Out from Applications left, into DailyLogs right -->
    <path class="rel-line" d="M 470 590 L 340 590" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 8. CompanyProfiles (900..1180) straight down to JobPosts (900..1180, y=330..575) -->
    <path class="rel-line" d="M 1040 285 L 1040 330" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 9. JobPosts (900..1180) straight left to Applications (470..750) -->
    <path class="rel-line" d="M 900 490 L 750 490" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 10. JobPosts (900..1180) down to InternshipEvaluations (900..1180, y=630..885) -->
    <path class="rel-line" d="M 1040 575 L 1040 630" marker-start="url(#one-start)" marker-end="url(#crow-end)" />

    <!-- 11. Applications (470..750) right to InternshipEvaluations (900..1180) -->
    <!-- Out from Applications right, step down into InternshipEvaluations left -->
    <path class="rel-line" d="M 750 590 L 820 590 L 820 730 L 900 730" marker-start="url(#one-start)" marker-end="url(#one-end)" />
