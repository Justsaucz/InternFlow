name: internflow-cloudcheck
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: internflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: internflow
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internflow -d internflow"]
      interval: 3s
      retries: 20
  migrate:
    build: {context: .., dockerfile: backend/Dockerfile.production, target: migration}
    environment:
      DATABASE_URL: postgresql://internflow:${DB_PASSWORD}@db:5432/internflow?schema=public
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: {context: .., dockerfile: backend/Dockerfile.production, target: runtime}
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://internflow:${DB_PASSWORD}@db:5432/internflow?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      CORS_ORIGIN: http://127.0.0.1:${WEB_PORT:-8088}
      ALLOW_HTTP_ORIGINS: 'true'
      STORAGE_MODE: local
      ALLOW_LOCAL_STORAGE: 'true'
      UPLOAD_DIR: /app/uploads
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
  frontend:
    build: {context: .., dockerfile: frontend/Dockerfile.production, target: runtime}
    ports: ["127.0.0.1:${WEB_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  dbdata:
  uploads:
